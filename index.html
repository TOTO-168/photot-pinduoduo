<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Photot拼多多是一個手機和桌面都能使用的本機照片拼貼工具。"
    />
    <title>Photot拼多多</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <div class="brand-mark" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div>
            <h1>Photot拼多多</h1>
            <p>本機處理</p>
          </div>
        </div>

        <div class="top-actions">
          <input id="photoInput" type="file" accept="image/*" multiple hidden />
          <div class="export-control">
            <button class="button primary" id="exportToggle" type="button" aria-expanded="false">
              輸出
            </button>
            <div class="export-menu" id="exportMenu" hidden>
              <button type="button" data-export-format="png">PNG</button>
              <button type="button" data-export-format="jpg">JPG</button>
            </div>
          </div>
        </div>
      </header>

      <main class="workspace">
        <aside class="control-rail" aria-label="拼圖控制">
          <section class="tool-section">
            <div class="section-heading">
              <span>模式</span>
            </div>
            <div class="segmented" role="tablist" aria-label="拼圖模式">
              <button class="segment is-active" data-mode="grid" type="button">模板</button>
              <button class="segment" data-mode="free" type="button">自由</button>
            </div>
          </section>

          <section class="tool-section">
            <div class="section-heading">
              <span>比例</span>
            </div>
            <div class="ratio-grid" id="ratioButtons" aria-label="社群平台">
              <button class="chip is-active" data-platform="instagram" type="button">IG</button>
              <button class="chip" data-platform="facebook" type="button">FB</button>
              <button class="chip" data-platform="threads" type="button">Threads</button>
              <button class="chip" data-platform="x" type="button">X</button>
              <button class="chip" data-platform="tiktok" type="button">TikTok</button>
              <button class="chip" data-platform="linkedin" type="button">LinkedIn</button>
              <button class="chip" data-platform="pinterest" type="button">Pinterest</button>
              <button class="chip" data-platform="youtube" type="button">YouTube</button>
              <button class="chip" data-ratio="custom" type="button">自訂</button>
            </div>
            <div class="ratio-submenu" id="ratioSubmenu" aria-label="社群尺寸"></div>
            <div class="custom-size" id="customSize">
              <label>
                <span>寬</span>
                <input id="customWidth" type="number" min="320" max="4096" value="1600" />
              </label>
              <label>
                <span>高</span>
                <input id="customHeight" type="number" min="320" max="4096" value="1600" />
              </label>
            </div>
          </section>

          <section class="tool-section grid-only">
            <div class="section-heading">
              <span>模板</span>
              <button class="icon-button" id="shuffleLayout" type="button" title="重新排列">
                ↻
              </button>
            </div>
            <div class="layout-grid" id="layoutButtons">
              <button class="layout-button is-active" data-layout="auto" type="button" aria-label="自動">
                <span class="layout-icon auto"></span>
              </button>
              <button class="layout-button" data-layout="mosaic" type="button" aria-label="錯落">
                <span class="layout-icon mosaic"></span>
              </button>
              <button class="layout-button" data-layout="rows" type="button" aria-label="橫列">
                <span class="layout-icon rows"></span>
              </button>
              <button class="layout-button" data-layout="columns" type="button" aria-label="直欄">
                <span class="layout-icon columns"></span>
              </button>
            </div>
          </section>

          <section class="tool-section">
            <div class="section-heading">
              <span>外觀</span>
            </div>
            <label class="range-row">
              <span>間距</span>
              <input id="gapRange" type="range" min="0" max="64" value="18" />
              <output id="gapValue">18</output>
            </label>
            <label class="range-row">
              <span>圓角</span>
              <input id="radiusRange" type="range" min="0" max="80" value="24" />
              <output id="radiusValue">24</output>
            </label>
            <label class="range-row">
              <span>邊框</span>
              <input id="borderRange" type="range" min="0" max="30" value="0" />
              <output id="borderValue">0</output>
            </label>
            <div class="swatch-row">
              <span>背景</span>
              <div class="swatches" id="backgroundSwatches" aria-label="背景色">
                <button class="swatch is-active" data-color="#f5f5f7" style="--swatch: #f5f5f7" type="button"></button>
                <button class="swatch" data-color="#ffffff" style="--swatch: #ffffff" type="button"></button>
                <button class="swatch" data-color="#111827" style="--swatch: #111827" type="button"></button>
                <button class="swatch" data-color="#dbeafe" style="--swatch: #dbeafe" type="button"></button>
                <button class="swatch" data-color="#fee2e2" style="--swatch: #fee2e2" type="button"></button>
                <button class="swatch" data-color="#dcfce7" style="--swatch: #dcfce7" type="button"></button>
              </div>
            </div>
          </section>

          <section class="tool-section" id="selectedTools">
            <div class="section-heading">
              <span>照片</span>
              <div class="mini-actions">
                <button class="icon-button" id="moveBack" type="button" title="向前排序">←</button>
                <button class="icon-button" id="moveNext" type="button" title="向後排序">→</button>
                <button class="icon-button danger" id="removePhoto" type="button" title="移除">×</button>
              </div>
            </div>
            <label class="range-row">
              <span>縮放</span>
              <input id="zoomRange" type="range" min="100" max="260" value="100" />
              <output id="zoomValue">100</output>
            </label>
            <label class="range-row free-only">
              <span>大小</span>
              <input id="sizeRange" type="range" min="12" max="96" value="42" />
              <output id="sizeValue">42</output>
            </label>
            <label class="range-row free-only">
              <span>旋轉</span>
              <input id="rotateRange" type="range" min="-45" max="45" value="0" />
              <output id="rotateValue">0</output>
            </label>
          </section>
        </aside>

        <section class="stage-area" aria-label="拼圖畫布">
          <div class="canvas-toolbar">
            <button class="button subtle" id="clearDemo" type="button">清空範例</button>
          </div>
          <div class="canvas-frame" id="canvasFrame">
            <label class="canvas-add-button" for="photoInput" title="加入照片" aria-label="加入照片"></label>
            <canvas id="collageCanvas" aria-label="Photot拼多多預覽"></canvas>
          </div>
        </section>

        <aside class="photo-strip" aria-label="照片列表">
          <div class="section-heading">
            <span>圖層</span>
            <button class="icon-button" id="resetPhoto" type="button" title="重設照片位置">⌁</button>
          </div>
          <div class="thumb-list" id="thumbList"></div>
        </aside>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
